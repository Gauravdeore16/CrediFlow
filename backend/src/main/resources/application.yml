server:
  port: 8080

spring:
  application:
    name: crediflow-backend
  datasource:
    url: jdbc:h2:file:./data/crediflowdb;AUTO_SERVER=TRUE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: CrediFlowSuperSecretEncryptionKeyForJWTGeneration9876543210KeyMustBeLongEnough
  expiration: 86400000 # 24 hours in milliseconds

file:
  upload-dir: ./uploads

logging:
  level:
    com.loansphere: INFO
